<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA-ROVER MONITORING SYSTEM</title>
    <link rel="stylesheet" type="text/css" href="./style.css">
</head>
<body>
    <header class="topbar">
        <!--this block for navigation section-->
        <div class="brand">
            <div class="brand-logo"><b>N</b></div>
                <div>
                    <h1>NETRA</h1>
                    <p>Robot Mission Control</p>
            </div>
        </div>
          <!--this block for navigation section-->
          <nav>
             <a href="#Dashboard ">Dashboard</a>
            <a href="#Fleet ">Fleet</a>
            <a href="#Telemetry ">Telemetry</a>
            <a href="#Alerts ">Alerts</a>
          </nav>
          <!--this block shows system online , timing-->
          <div class="header-right">
               <span class="online-dot"></span>
               <span>SYSTEM ONLINE</span>
               <strong id="clock">--:--:--</strong>
</div>
               <!--this is for dispatch mission button-->
               <button id="dispatch-open" type="button">+Dispatch Mission</button>
    </header>
</body>
</html>
